<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OMAHA OPEN — אומהה פתוחה</title>
<meta name="theme-color" content="#06060b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Omaha Open">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06060b; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.09); --txt:#f2f3f7; --dim:#9aa0b4;
  --gold:#ffd166; --accent:#7c5cff; --cyan:#22d3ee; --danger:#ff5470; --win:#4ade80;
  --card-face:#faf6ec; --card-black:#232634; --card-red:#d92b45;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:'Heebo',system-ui,sans-serif;
  overflow-x:hidden; min-height:100dvh;
}
/* ---- רקע קולנועי ---- */
.bg-orb{position:fixed;border-radius:50%;opacity:.55;pointer-events:none;z-index:0}
.orb1{width:60vmax;height:60vmax;background:radial-gradient(circle,#2a1b6e 0%,transparent 65%);top:-25vmax;right:-15vmax}
.orb2{width:50vmax;height:50vmax;background:radial-gradient(circle,#0b3b4a 0%,transparent 65%);bottom:-20vmax;left:-15vmax}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,#000 30%,transparent 75%)}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:20px 16px calc(150px + env(safe-area-inset-bottom))}
/* ---- מסכים ---- */
.screen{display:none;animation:screenIn .45s ease-out}
.screen.active{display:block}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* ---- לובי / אימות ---- */
.hero{text-align:center;padding:7vh 0 26px}
.hero.small{padding:4vh 0 18px}
.logo-en{font-weight:900;font-size:clamp(40px,8vw,76px);letter-spacing:.04em;line-height:1;direction:ltr;
  background:linear-gradient(120deg,#fff 20%,var(--cyan) 55%,var(--accent) 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 28px rgba(124,92,255,.35))}
.hero.small .logo-en{font-size:clamp(30px,5vw,48px)}
.tagline{color:var(--dim);margin-top:12px;font-size:17px}
.tagline b{color:var(--gold);font-weight:600}
.glass{background:var(--panel);border:1px solid var(--border);border-radius:20px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 24px 60px rgba(0,0,0,.45)}
.lobby-box{max-width:420px;margin:0 auto;padding:26px;display:flex;flex-direction:column;gap:14px}
input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--border);
  background:rgba(0,0,0,.35);color:var(--txt);font:inherit;font-size:16px;outline:none;transition:border-color .3s ease-out}
input:focus{border-color:var(--accent)}
input.code{direction:ltr;text-align:center;letter-spacing:.5em;font-weight:800;text-transform:uppercase}
input.ltr{direction:ltr;text-align:left}
.btn{padding:14px 18px;border-radius:14px;border:1px solid var(--border);cursor:pointer;
  font:inherit;font-size:16px;font-weight:800;color:var(--txt);background:var(--panel2);
  transition:transform .3s ease-out,box-shadow .3s ease-out,background .3s ease-out}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.12)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(120deg,var(--accent),#5b3df0);border-color:transparent;
  box-shadow:0 10px 30px rgba(124,92,255,.35)}
.btn.primary:hover{box-shadow:0 16px 40px rgba(124,92,255,.5)}
.btn.gold{background:linear-gradient(120deg,#f7c948,#f0a202);color:#1c1500;border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.divider{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:13px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.joinrow{display:flex;gap:10px}
.joinrow input{flex:1}
/* טאבים */
.tabs{display:flex;gap:6px;background:rgba(0,0,0,.3);border-radius:14px;padding:5px}
.tabs button{flex:1;padding:11px;border:none;border-radius:10px;background:transparent;color:var(--dim);
  font:inherit;font-weight:800;cursor:pointer;transition:background .3s ease-out,color .3s ease-out}
.tabs button.active{background:var(--panel2);color:var(--txt)}
.pane{display:none;flex-direction:column;gap:12px}
.pane.active{display:flex}
.greet{text-align:center;font-size:18px;font-weight:800;margin-bottom:2px}
.greet b{color:var(--gold)}
.linkline{text-align:center;color:var(--dim);font-size:13px;cursor:pointer;text-decoration:underline}
.hint{color:var(--dim);font-size:12px;line-height:1.6}
/* בחירת שולחן */
.stake-row{display:flex;gap:10px}
.stake-btn{flex:1;padding:12px;border-radius:14px;border:1px solid var(--border);cursor:pointer;
  background:rgba(0,0,0,.3);color:var(--dim);font:inherit;font-weight:600;font-size:14px;line-height:1.6;
  transition:border-color .3s ease-out,color .3s ease-out,box-shadow .3s ease-out}
.stake-btn b{display:block;font-size:20px;font-weight:900}
.stake-btn.active{border-color:var(--gold);color:var(--txt);box-shadow:0 0 18px rgba(255,209,102,.25)}
.stake-btn.active b{color:var(--gold)}
/* שולחנות פתוחים */
.rlist{display:flex;flex-direction:column;gap:10px}
.rcard{display:flex;align-items:center;gap:10px;padding:12px 16px;animation:seatIn .4s ease-out backwards}
.rcard .rinfo{flex:1;min-width:0}
.rcard .rhost{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .rmeta{color:var(--dim);font-size:12px;margin-top:2px}
.rcard .rmeta .hi{color:var(--gold);font-weight:800}
/* ---- חדר המתנה ---- */
.room-head{text-align:center;padding:18px 0 6px}
.room-head h2{font-size:22px;font-weight:800}
.codebox{display:inline-flex;align-items:center;gap:14px;margin-top:14px;padding:12px 22px}
.codebox .code-txt{direction:ltr;font-size:38px;font-weight:900;letter-spacing:.35em;color:var(--gold);
  text-shadow:0 0 24px rgba(255,209,102,.35)}
.copy-hint{color:var(--dim);font-size:13px;margin-top:10px}
.stake-badge{display:inline-block;margin-top:10px;padding:4px 14px;border-radius:99px;font-size:13px;font-weight:800;
  border:1px solid rgba(255,209,102,.4);color:var(--gold)}
.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:24px 0}
.seat{padding:18px;display:flex;align-items:center;gap:12px;min-height:84px;animation:seatIn .5s ease-out backwards}
.seat:nth-child(2){animation-delay:.08s}.seat:nth-child(3){animation-delay:.16s}.seat:nth-child(4){animation-delay:.24s}
@keyframes seatIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.seat.empty{border-style:dashed;color:var(--dim);justify-content:center}
.avatar{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:19px;background:linear-gradient(135deg,var(--accent),var(--cyan));color:#fff}
.seat .info{flex:1;min-width:0}
.seat .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .pts{color:var(--gold);font-size:14px;font-weight:600}
.seat .pts.low{color:var(--danger)}
.host-badge{font-size:11px;color:var(--cyan);border:1px solid rgba(34,211,238,.4);border-radius:99px;padding:2px 8px}
.me-badge{font-size:10px;color:#0e1500;background:var(--gold);border-radius:99px;padding:1px 7px;font-weight:800}
.room-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.rules{margin:26px auto 0;max-width:640px;padding:18px 22px;color:var(--dim);font-size:14px;line-height:1.9}
.rules b{color:var(--txt)}
/* ---- שולחן ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;margin-bottom:18px}
.roundmeter{display:flex;align-items:center;gap:8px;font-weight:800}
.rseg{width:34px;height:6px;border-radius:99px;background:rgba(255,255,255,.12);transition:background .4s ease-out}
.rseg.on{background:linear-gradient(90deg,var(--cyan),var(--accent))}
.potchip{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;color:var(--gold)}
.potchip .coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#f0a202 70%);
  box-shadow:0 0 16px rgba(255,209,102,.5)}
.board-wrap{position:relative;padding:30px 10px;margin-bottom:16px;text-align:center}
.board-glow{position:absolute;inset:0;border-radius:24px;
  background:radial-gradient(ellipse 70% 90% at 50% 50%,rgba(124,92,255,.14),rgba(34,211,238,.05) 60%,transparent);
  border:1px solid var(--border)}
.board{position:relative;display:flex;gap:clamp(6px,1.6vw,14px);justify-content:center;direction:ltr}
.round-flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-size:clamp(28px,5vw,44px);font-weight:900;color:#fff;opacity:0;text-shadow:0 0 30px rgba(124,92,255,.8)}
.round-flash.show{animation:rf 1.4s ease-out}
@keyframes rf{0%{opacity:0;transform:scale(.8)}20%{opacity:1;transform:scale(1.05)}45%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
/* קלפים */
.card{direction:ltr;position:relative;width:clamp(56px,11vw,84px);aspect-ratio:5/7;perspective:700px}
.card .inner{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(180deg);
  transition:transform .55s cubic-bezier(.2,.7,.3,1);will-change:transform}
.card.flip .inner{transform:rotateY(0)}
.card .face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card .back{transform:rotateY(180deg);background:linear-gradient(145deg,#181a2c,#0d0e1c);
  border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.card .back::after{content:'◆';font-size:20px;background:linear-gradient(120deg,var(--cyan),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;opacity:.85}
.card .front{background:var(--card-face);border:1px solid #d8d2c0;color:var(--card-black);
  transform:rotateY(0);display:flex;flex-direction:column;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.card .front.red{color:var(--card-red)}
.card .corner{font-weight:900;line-height:1;padding:6px 0 0 7px;font-size:clamp(13px,2.2vw,17px)}
.card .corner span{display:block;font-size:clamp(11px,2vw,15px)}
.card .pip{flex:1;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,4vw,32px)}
.card.used .front{box-shadow:0 0 0 2px var(--gold),0 0 22px rgba(255,209,102,.55)}
/* שחקנים */
.pods{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.pod{position:relative;padding:14px 16px;transition:border-color .4s ease-out}
.pod::after{content:'';position:absolute;inset:-1px;border-radius:20px;pointer-events:none;opacity:0;
  box-shadow:0 0 0 2px var(--win),0 0 34px rgba(74,222,128,.35);transition:opacity .4s ease-out}
.pod.winner::after{opacity:1}
.pod-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pod-head .avatar{width:38px;height:38px;font-size:16px}
.pod .pname{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.pod .ppts{color:var(--gold);font-weight:800;font-size:14px}
.pod .ppts.flash{animation:ptsFlash .8s ease-out}
@keyframes ptsFlash{0%{transform:scale(1)}30%{transform:scale(1.25);color:#fff}100%{transform:scale(1)}}
.pips{display:flex;gap:5px;margin-inline-start:auto}
.pip-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.15);transition:background .4s ease-out,box-shadow .4s ease-out}
.pip-dot.on{background:var(--gold);box-shadow:0 0 10px rgba(255,209,102,.7)}
.holes{display:flex;gap:6px;direction:ltr;justify-content:center}
.holes .card{width:clamp(46px,8.5vw,64px)}
.wtag{position:absolute;top:-11px;inset-inline-start:16px;background:linear-gradient(120deg,#16a34a,#4ade80);
  color:#03140a;font-size:12px;font-weight:900;border-radius:99px;padding:3px 12px;opacity:0;transform:translateY(6px);
  transition:opacity .4s ease-out,transform .4s ease-out}
.pod.winner .wtag{opacity:1;transform:none}
/* באנר תוצאה */
.result-bar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  pointer-events:none;transform:translateY(120%);transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.result-bar.show{transform:none}
.result-inner{pointer-events:auto;display:flex;align-items:center;gap:16px;padding:14px 22px;max-width:720px;width:100%;
  background:rgba(14,15,26,.88);border:1px solid var(--border);border-radius:18px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 -8px 40px rgba(0,0,0,.5)}
.result-txt{flex:1;font-size:16px}
.result-txt b{color:var(--gold)}
.result-txt .hand{color:var(--cyan);font-weight:800}
/* מסך סיום */
.over-head{text-align:center;padding:30px 0 10px}
.over-head h2{font-size:clamp(28px,5vw,42px);font-weight:900}
.sweep-banner{max-width:560px;margin:18px auto;padding:20px;text-align:center;border-radius:20px;
  background:linear-gradient(120deg,rgba(255,209,102,.18),rgba(124,92,255,.18));
  border:1px solid rgba(255,209,102,.45);font-size:18px;font-weight:800}
.sweep-banner .x2{font-size:44px;font-weight:900;color:var(--gold);text-shadow:0 0 30px rgba(255,209,102,.6);direction:ltr}
.settle{max-width:560px;margin:16px auto;padding:8px 0;overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border)}
.srow:last-child{border-bottom:0}
.srow .rank{width:26px;height:26px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.srow:first-child .rank{background:var(--gold);color:#1c1500}
.srow .nm{flex:1;font-weight:800}
.srow .wl{font-weight:900;direction:ltr}
.srow .wl.plus{color:var(--win)} .srow .wl.minus{color:var(--danger)}
.srow .bal{color:var(--dim);font-size:13px;width:90px;text-align:left;direction:ltr}
.over-actions{display:flex;justify-content:center;gap:12px;margin-top:22px}
/* ---- דאשבורד ניהול ---- */
.dash{max-width:680px;margin:0 auto}
.dash-chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.chip{padding:16px;text-align:center}
.chip .cv{font-size:26px;font-weight:900;color:var(--gold)}
.chip .cl{color:var(--dim);font-size:13px;margin-top:4px}
.chip.click{cursor:pointer;transition:border-color .3s ease-out}
.chip.click:hover{border-color:var(--gold)}
.drow{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.drow:last-child{border-bottom:0}
.drow .dinfo{flex:1;min-width:130px}
.drow .dname{font-weight:800}
.drow .demail{color:var(--dim);font-size:12px;direction:ltr;text-align:right}
.drow .dpts{font-weight:900;color:var(--gold);min-width:64px;text-align:center}
.drow .dpts.neg{color:var(--danger)}
.dash-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0}
.waitmsg{text-align:center;color:var(--dim);margin-top:18px;font-size:14px}
.host-actions{display:flex;justify-content:center;margin-top:18px}
/* מנהל fab */
.admin-fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));inset-inline-start:18px;z-index:22;width:46px;height:46px;border-radius:50%;
  border:1px solid var(--border);background:rgba(14,15,26,.8);backdrop-filter:blur(10px);color:var(--dim);
  font-size:19px;cursor:pointer;transition:color .3s ease-out,transform .3s ease-out}
.admin-fab:hover{color:var(--gold);transform:translateY(-2px)}
/* טוסט */
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-80px);z-index:60;
  background:rgba(14,15,26,.92);border:1px solid var(--border);border-radius:14px;padding:12px 22px;
  font-weight:600;transition:transform .4s cubic-bezier(.2,.7,.3,1);backdrop-filter:blur(12px);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{border-color:rgba(255,84,112,.5);color:#ffb3c0}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-width:640px){
  .pods{grid-template-columns:1fr 1fr;gap:10px}
  .pod{padding:10px}
  .holes{gap:4px}
  .holes .card{width:clamp(30px,8.2vw,52px)}
  .seat{min-height:70px}
}
</style>
</head>
<body>
<div class="bg-orb orb1"></div><div class="bg-orb orb2"></div><div class="bg-grid"></div>
<main>

  <!-- הרשמה / התחברות -->
  <section id="scr-auth" class="screen">
    <div class="hero">
      <div class="logo-en">OMAHA OPEN</div>
      <div class="tagline"><b>אומהה - פתוחים</b></div>
    </div>
    <div class="glass lobby-box">
      <div class="tabs">
        <button id="tab-login" class="active">התחברות</button>
        <button id="tab-reg">הרשמה</button>
      </div>
      <div class="pane active" id="pane-login">
        <input id="li-email" class="ltr" type="email" placeholder="אימייל" autocomplete="email">
        <input id="li-pass" class="ltr" type="password" placeholder="סיסמה" autocomplete="current-password">
        <button class="btn primary" id="btn-login">כניסה</button>
      </div>
      <div class="pane" id="pane-reg">
        <input id="rg-name" maxlength="16" placeholder="שם תצוגה (מה שכולם יראו)">
        <input id="rg-email" class="ltr" type="email" placeholder="אימייל" autocomplete="email">
        <input id="rg-pass" class="ltr" type="password" placeholder="סיסמה (6+ תווים)" autocomplete="new-password">
        <input id="rg-invite" class="ltr" placeholder="קוד הזמנה (מצורף להזמנה שקיבלת)">
        <button class="btn primary" id="btn-reg">הרשמה</button>
        <div class="hint">ההרשמה בהזמנה בלבד — קוד ההזמנה מגיע ממי שהזמין אותך לשחק (זה לא קוד המנהל).</div>
      </div>
    </div>
  </section>

  <!-- לובי -->
  <section id="scr-lobby" class="screen">
    <div class="hero small">
      <div class="logo-en">OMAHA OPEN</div>
    </div>
    <div class="glass lobby-box">
      <div class="greet">שלום, <b id="greet-name"></b></div>
      <div class="stake-row">
        <button class="stake-btn active" data-stake="low">שולחן רגיל<b>52.5</b></button>
        <button class="stake-btn" data-stake="high">שולחן גבוה<b>105</b></button>
      </div>
      <button class="btn primary" id="btn-create">צור חדר חדש</button>
      <div class="divider">או הצטרף לחדר קיים</div>
      <div class="joinrow">
        <input id="inp-code" class="code" maxlength="4" placeholder="KODC">
        <button class="btn" id="btn-join">הצטרף</button>
      </div>
      <div class="divider">🃏 שולחנות פתוחים</div>
      <div id="rooms-list" class="rlist"><div class="hint" style="text-align:center">טוען שולחנות…</div></div>
      <div class="linkline" id="btn-logout">התנתקות</div>
    </div>
  </section>

  <!-- חדר המתנה -->
  <section id="scr-room" class="screen">
    <div class="room-head">
      <h2>חדר המתנה</h2>
      <div class="glass codebox">
        <span class="code-txt" id="room-code">----</span>
        <button class="btn ghost" id="btn-copy" title="העתק קישור הזמנה">📋 העתק הזמנה</button>
      </div>
      <div><span class="stake-badge" id="room-stake"></span></div>
      <div class="copy-hint">שלח לחברים את הקוד או את קישור ההזמנה — צריך בדיוק 4 שחקנים</div>
    </div>
    <div class="seats" id="seats"></div>
    <div class="room-actions" id="room-actions"></div>
    <div class="glass rules" id="rules"></div>
  </section>

  <!-- שולחן משחק -->
  <section id="scr-table" class="screen">
    <div class="glass topbar">
      <button class="btn ghost small" id="btn-home-t" title="דף הבית">🏠</button>
      <div class="roundmeter">
        <span id="round-label">סיבוב 1</span>
        <span class="rseg" data-r="1"></span><span class="rseg" data-r="2"></span>
        <span class="rseg" data-r="3"></span><span class="rseg" data-r="4"></span>
      </div>
      <div class="potchip"><span class="coin"></span><span id="pot-label">200</span></div>
    </div>
    <div class="board-wrap">
      <div class="board-glow"></div>
      <div class="board" id="board"></div>
      <div class="round-flash" id="round-flash"></div>
    </div>
    <div class="pods" id="pods"></div>
    <div class="host-actions" id="table-actions"></div>
  </section>

  <!-- סיום משחק -->
  <section id="scr-over" class="screen">
    <div class="over-head"><h2>סיכום המשחק</h2></div>
    <div id="sweep-slot"></div>
    <div class="glass settle" id="settle"></div>
    <div class="over-actions" id="over-actions"></div>
  </section>

  <!-- דאשבורד ניהול -->
  <section id="scr-dash" class="screen">
    <div class="dash">
      <div class="room-head"><h2>📊 דאשבורד ניהול</h2></div>
      <div id="dash-body"></div>
      <div class="dash-actions"><button class="btn ghost" id="dash-back">→ חזרה</button></div>
    </div>
  </section>

</main>

<!-- תוצאת סיבוב -->
<div class="result-bar" id="result-bar">
  <div class="glass result-inner">
    <div class="result-txt" id="result-txt"></div>
    <div id="result-actions"></div>
  </div>
</div>

<button class="admin-fab" id="admin-fab" title="דאשבורד מנהל">⚙</button>
<div id="toast"></div>
<input type="file" id="import-file" accept=".json" style="display:none">

<script>
'use strict';
/* ---------- מצב ---------- */
const S = {
  code: null, pid: null, name: null,
  state: null, v: -1, pollSeq: 0,
  stake: 'low',
  adminToken: sessionStorage.getItem('adminToken') || null,
  shownGame: -1, shownRound: 0, flippedCount: 0, dealtRound: 0,
  lastPoints: {},
};
const $ = id => document.getElementById(id);
const SUIT = { S:{g:'♠',red:0}, H:{g:'♥',red:1}, D:{g:'♦',red:1}, C:{g:'♣',red:0} };
const RANK = { T:'10', J:'J', Q:'Q', K:'K', A:'A' };

/* ---------- עזרים ---------- */
function toast(msg, err) {
  const t = $('toast');
  t.textContent = msg;
  t.className = err ? 'err show' : 'show';
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2800);
}
async function api(path, body) {
  const res = await fetch(path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || 'שגיאה');
    err.status = res.status;
    throw err;
  }
  return data;
}
function initial(name) {
  const chars = [...String(name || '').trim()];
  return chars.length ? chars[0] : '?';
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function esc(s) { return String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}
function btn(label, cls, fn, disabled) {
  const b = document.createElement('button');
  b.className = 'btn ' + (cls || '');
  b.textContent = label;
  b.onclick = fn;
  if (disabled) b.disabled = true;
  return b;
}
function cardEl(id) {
  const rank = RANK[id[0]] || id[0];
  const suit = SUIT[id[1]];
  const el = document.createElement('div');
  el.className = 'card flip';
  el.dataset.cid = id;
  el.innerHTML = `<div class="inner">
    <div class="face back"></div>
    <div class="face front ${suit.red ? 'red' : ''}">
      <div class="corner">${rank}<span>${suit.g}</span></div>
      <div class="pip">${suit.g}</div>
    </div></div>`;
  return el;
}

/* ---------- חשבון ---------- */
function auth() { try { return JSON.parse(localStorage.getItem('omahaAuth')); } catch (e) { return null; } }
function saveAuth(a) { localStorage.setItem('omahaAuth', JSON.stringify(a)); }
function clearAuth() { localStorage.removeItem('omahaAuth'); }
function saveSession() { localStorage.setItem('omaha', JSON.stringify({ code: S.code, pid: S.pid, name: S.name })); }
function clearSession() { localStorage.removeItem('omaha'); }
function needLogin(msg) {
  clearAuth();
  show('scr-auth');
  if (msg) toast(msg, 1);
}
function showLobby() {
  const a = auth();
  if (!a) return show('scr-auth');
  $('greet-name').textContent = a.name;
  show('scr-lobby');
  loadRooms();
}
function exitToLobby() {
  S.pollSeq++; S.code = null; S.pid = null; S.state = null; S.v = -1;
  clearSession();
  showLobby();
}
async function leaveRoom() {
  try { await api('/api/action', { code: S.code, pid: S.pid, type: 'leave' }); } catch (e) {}
  exitToLobby();
}
/* שולחנות פתוחים בלובי */
async function loadRooms() {
  const a = auth();
  const list = $('rooms-list');
  if (!a || !$('scr-lobby').classList.contains('active')) return;
  try {
    const r = await api('/api/rooms', { session: a.token });
    list.innerHTML = '';
    if (!r.rooms.length) {
      list.innerHTML = '<div class="hint" style="text-align:center">אין כרגע שולחנות פתוחים — פתח אחד למעלה!</div>';
      return;
    }
    for (const room of r.rooms) {
      const d = document.createElement('div');
      d.className = 'glass rcard';
      const stakeTxt = room.stake === 'high'
        ? '<span class="hi">שולחן גבוה · 105</span>' : 'שולחן רגיל · 52.5';
      d.innerHTML = `<div class="rinfo">
        <div class="rhost">🃏 השולחן של ${esc(room.host)}</div>
        <div class="rmeta">${stakeTxt} · ${room.count}/${room.seats} שחקנים${room.hasBots ? ' · אימון' : ''}</div></div>`;
      d.appendChild(btn('הצטרף', 'small primary', () => joinRoom(room.code)));
      list.appendChild(d);
    }
  } catch (e) { /* ננסה שוב ברענון הבא */ }
}
setInterval(loadRooms, 5000);

/* טאבים */
$('tab-login').onclick = () => setTab('login');
$('tab-reg').onclick = () => setTab('reg');
function setTab(t) {
  $('tab-login').classList.toggle('active', t === 'login');
  $('tab-reg').classList.toggle('active', t === 'reg');
  $('pane-login').classList.toggle('active', t === 'login');
  $('pane-reg').classList.toggle('active', t === 'reg');
}
$('btn-login').onclick = async function () {
  if (this.disabled) return;
  this.disabled = true;
  try {
    const r = await api('/api/login', { email: $('li-email').value, password: $('li-pass').value });
    saveAuth({ token: r.token, name: r.name, email: r.email });
    showLobby();
  } catch (e) { toast(e.message, 1); }
  finally { this.disabled = false; }
};
$('btn-reg').onclick = async function () {
  if (this.disabled) return;
  this.disabled = true;
  try {
    const r = await api('/api/register', {
      name: $('rg-name').value, email: $('rg-email').value,
      password: $('rg-pass').value, invite: $('rg-invite').value,
    });
    saveAuth({ token: r.token, name: r.name, email: r.email });
    toast('✓ נרשמת! בקש מהמנהל נקודות כדי לשחק');
    showLobby();
  } catch (e) { toast(e.message, 1); }
  finally { this.disabled = false; }
};
$('li-pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-login').click(); });
$('rg-invite').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-reg').click(); });
$('btn-logout').onclick = () => {
  clearAuth(); clearSession();
  S.pollSeq++; S.code = null;
  show('scr-auth');
};

/* ---------- לובי ---------- */
document.querySelectorAll('.stake-btn').forEach(b => b.onclick = () => {
  S.stake = b.dataset.stake;
  document.querySelectorAll('.stake-btn').forEach(x => x.classList.toggle('active', x === b));
});
$('btn-create').onclick = async function () {
  if (this.disabled) return;
  const a = auth();
  if (!a) return needLogin('צריך להתחבר');
  this.disabled = true;
  try {
    const r = await api('/api/create', { session: a.token, stake: S.stake });
    enterRoom(r.code, r.pid, r.name);
  } catch (e) {
    if (e.status === 401) needLogin(e.message); else toast(e.message, 1);
  }
  finally { this.disabled = false; }
};
async function joinRoom(code) {
  const a = auth();
  if (!a) return needLogin('צריך להתחבר');
  try {
    const r = await api('/api/join', { session: a.token, code });
    enterRoom(r.code, r.pid, r.name);
  } catch (e) {
    if (e.status === 401) needLogin(e.message); else toast(e.message, 1);
  }
}
$('btn-join').onclick = async function () {
  if (this.disabled) return;
  const code = $('inp-code').value.trim().toUpperCase();
  if (code.length !== 4) return toast('קוד חדר = 4 תווים', 1);
  this.disabled = true;
  try { await joinRoom(code); } finally { this.disabled = false; }
};
$('btn-home-t').onclick = () => {
  const st = S.state;
  if (!st || st.phase === 'waiting' || st.phase === 'over') return leaveRoom();
  if (confirm('לצאת לדף הראשי? המשחק ימשיך לרוץ והיד שלך תמשיך לשחק עד הסוף.')) exitToLobby();
};
$('inp-code').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-join').click(); });
function enterRoom(code, pid, name) {
  S.code = code; S.pid = pid; S.name = name; S.v = -1;
  saveSession();
  poll();
}
$('btn-copy').onclick = async () => {
  const link = `${location.origin}/?join=${S.code}`;
  const text = `🃏 בוא לשחק אומהה - פתוחים!\nקוד חדר: ${S.code}\n${link}`;
  try { await navigator.clipboard.writeText(text); toast('✓ ההזמנה הועתקה — שלח לחברים'); }
  catch (e) { toast(link); }
};

/* ---------- פולינג ---------- */
async function poll() {
  const seq = ++S.pollSeq;               // מבטל כל לולאה קודמת (חדר ישן)
  while (S.code && seq === S.pollSeq) {
    try {
      const ctrl = new AbortController();
      const watchdog = setTimeout(() => ctrl.abort(), 35000);   // השרת עונה תוך 25ש'
      const res = await fetch(`/api/state?code=${S.code}&pid=${S.pid}&v=${S.v}`, { signal: ctrl.signal });
      clearTimeout(watchdog);
      if (seq !== S.pollSeq) return;
      if (res.status === 404) { clearSession(); location.reload(); return; }
      if (!res.ok) { await sleep(1500); continue; }
      const st = await res.json();
      if (seq !== S.pollSeq || st.code !== S.code) return;
      if (st.v !== undefined && st.v > S.v) { S.v = st.v; S.state = st; render(st); }
    } catch (e) {
      if (seq !== S.pollSeq) return;
      await sleep(2000);
    }
  }
}

/* ---------- רנדור ---------- */
function render(st) {
  if (st.phase === 'waiting') renderRoom(st);
  else if (st.phase === 'over') renderOver(st);
  else renderTable(st);
  renderResultBar(st);
}
function me(st) { return st.players.find(p => p.me); }
function amHost(st) { const m = me(st); return m && m.isHost; }
const stakeName = st => st.stake === 'high' ? 'שולחן גבוה' : 'שולחן רגיל';

function renderRoom(st) {
  show('scr-room');
  S.shownRound = 0; S.flippedCount = 0; S.dealtRound = 0; S.lastPoints = {};
  $('room-code').textContent = st.code;
  const buyIn = st.entry + st.fee;
  const anyBot = st.players.some(p => p.isBot);
  $('room-stake').textContent = anyBot
    ? `${stakeName(st)} · משחק אימון — בלי נקודות`
    : `${stakeName(st)} · כניסה ${buyIn}`;
  $('rules').innerHTML =
    `<b>איך משחקים?</b> כל שחקן משלם <b>${buyIn} נקודות</b> כניסה — ${st.entry} לקופה (סה"כ ${st.entry * st.seats}) + ${st.fee} עמלת בית. ` +
    `כולם מקבלים 4 קלפים <b>גלויים</b>. נפתח בורד של 5 קלפים — היד הטובה לפי חוקי אומהה (בדיוק 2 מהיד + 3 מהבורד) לוקחת <b>${st.entry} נק'</b>. ` +
    `הבורד נזרק, היד נשארת — וכך <b>4 סיבובים בלי ערבוב</b>. ` +
    `שחקן שלוקח את כל 4 הסיבובים מפעיל <b>הכפלה</b>: עוד ${st.entry} נק' מכל שחקן!`;
  const seats = $('seats');
  seats.innerHTML = '';
  for (let i = 0; i < st.seats; i++) {
    const p = st.players[i];
    const d = document.createElement('div');
    if (p) {
      const low = p.points < buyIn;
      d.className = 'glass seat';
      d.innerHTML = `<div class="avatar">${esc(initial(p.name))}</div>
        <div class="info">
          <div class="nm">${esc(p.name)} ${p.isHost ? '<span class="host-badge">מארח</span>' : ''} ${p.me ? '<span class="me-badge">אני</span>' : ''}</div>
          <div class="pts ${low ? 'low' : ''}">${p.points} נק' ${low ? '· חסר לכניסה' : ''}</div>
        </div>`;
    } else {
      d.className = 'glass seat empty';
      d.textContent = 'ממתין לשחקן…';
    }
    seats.appendChild(d);
  }
  const act = $('room-actions');
  act.innerHTML = '';
  if (amHost(st)) {
    const full = st.players.length === st.seats;
    const ready = anyBot ? full : (full && st.players.every(p => p.points >= buyIn));
    act.appendChild(btn(anyBot ? 'התחל משחק אימון' : `התחל משחק (כניסה ${buyIn})`, 'primary', () => action('start'), !ready));
    if (st.players.length < st.seats)
      act.appendChild(btn('מלא בשחקני דמו (אימון)', 'ghost', () => action('fillDemo')));
  } else {
    const w = document.createElement('div');
    w.className = 'waitmsg';
    w.textContent = 'ממתינים שהמארח יתחיל את המשחק…';
    act.appendChild(w);
  }
  act.appendChild(btn('🏠 עזוב חדר', 'ghost', leaveRoom));
}

function renderTable(st) {
  show('scr-table');
  // משחק חדש (או התחברות מחדש) — איפוס מלא של מצב התצוגה
  if (S.shownGame !== st.game) {
    S.shownGame = st.game;
    S.shownRound = 0; S.flippedCount = 0; S.dealtRound = 0; S.lastPoints = {};
    $('pods').innerHTML = '';
  }
  $('round-label').textContent = `סיבוב ${st.round}${st.practice ? ' · אימון' : ''}`;
  $('pot-label').textContent = st.pot;
  document.querySelectorAll('.rseg').forEach(seg =>
    seg.classList.toggle('on', +seg.dataset.r <= st.round));

  // בורד — סיבוב חדש: איפוס
  const board = $('board');
  if (S.shownRound !== st.round) {
    S.shownRound = st.round; S.flippedCount = 0;
    board.innerHTML = '';
    for (let i = 0; i < 5; i++) {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `<div class="inner"><div class="face back"></div><div class="face front"></div></div>`;
      board.appendChild(el);
    }
    const rf = $('round-flash');
    rf.textContent = `סיבוב ${st.round}`;
    rf.classList.remove('show'); void rf.offsetWidth; rf.classList.add('show');
  }
  // חשיפת קלפים חדשים עם סטאגר עוקב (נכון גם בהתחברות באמצע סיבוב)
  const slots = board.children;
  for (let i = S.flippedCount; i < st.board.length; i++) {
    const id = st.board[i];
    const fresh = cardEl(id);
    fresh.classList.remove('flip');
    slots[i].replaceWith(fresh);
    const delay = (i - S.flippedCount) * 130;
    setTimeout(() => fresh.classList.add('flip'), 40 + delay);
  }
  if (st.board.length > S.flippedCount) S.flippedCount = st.board.length;

  // שחקנים
  const pods = $('pods');
  if (S.dealtRound === 0 || pods.children.length !== st.players.length) {
    pods.innerHTML = '';
    for (const p of st.players) {
      const d = document.createElement('div');
      d.className = 'glass pod';
      d.dataset.seat = p.seat;
      d.innerHTML = `<div class="wtag">מנצח הסיבוב</div>
        <div class="pod-head">
          <div class="avatar">${esc(initial(p.name))}</div>
          <div><div class="pname">${esc(p.name)} ${p.me ? '<span class="me-badge">אני</span>' : ''}</div>
          <div class="ppts"><span class="pv">${p.points}</span> נק'</div></div>
          <div class="pips">${[1,2,3,4].map(() => '<span class="pip-dot"></span>').join('')}</div>
        </div>
        <div class="holes"></div>`;
      const holes = d.querySelector('.holes');
      p.hole.forEach((cid, i) => {
        const c = cardEl(cid);
        c.classList.remove('flip');
        holes.appendChild(c);
        setTimeout(() => c.classList.add('flip'), 150 + i * 110 + p.seat * 60);
      });
      pods.appendChild(d);
    }
    S.dealtRound = st.round;
  }
  // עדכון נקודות/פיפים/ניצחון
  for (const p of st.players) {
    const pod = pods.querySelector(`[data-seat="${p.seat}"]`);
    if (!pod) continue;
    const pv = pod.querySelector('.pv');
    if (S.lastPoints[p.seat] !== undefined && S.lastPoints[p.seat] !== p.points) {
      pv.parentElement.classList.remove('flash'); void pv.offsetWidth;
      pv.parentElement.classList.add('flash');
    }
    pv.textContent = p.points;
    S.lastPoints[p.seat] = p.points;
    pod.querySelectorAll('.pip-dot').forEach((d, i) => d.classList.toggle('on', i < p.wins));
    const isWinner = st.phase === 'result' && st.result &&
      st.result.winners.some(w => w.seat === p.seat);
    pod.classList.toggle('winner', isWinner);
    pod.querySelectorAll('.holes .card').forEach(c =>
      c.classList.toggle('used', isWinner && st.result.cards.includes(c.dataset.cid)));
  }
  // הדגשה על הבורד
  document.querySelectorAll('#board .card').forEach(c =>
    c.classList.toggle('used', st.phase === 'result' && st.result &&
      st.result.cards.includes(c.dataset.cid)));

  $('table-actions').innerHTML = '';
}

function renderResultBar(st) {
  const bar = $('result-bar');
  if (st.phase !== 'result') { bar.classList.remove('show'); return; }
  const r = st.result;
  const txt = $('result-txt');
  if (r.winners.length === 1) {
    txt.innerHTML = `🏆 <b>${esc(r.winners[0].name)}</b> לוקח את הסיבוב עם <span class="hand">${esc(r.handName)}</span> · ‎+${r.winners[0].share}‎ נק'`;
  } else {
    txt.innerHTML = `🤝 תיקו! <b>${r.winners.map(w => esc(w.name)).join(' + ')}</b> מתחלקים · <span class="hand">${esc(r.handName)}</span>`;
  }
  const ra = $('result-actions');
  ra.innerHTML = '';
  if (amHost(st)) {
    const last = st.round >= st.rounds;
    ra.appendChild(btn(last ? 'סיכום המשחק' : 'סיבוב הבא ←', 'primary', () => action('next')));
  }
  bar.classList.add('show');
}

function renderOver(st) {
  show('scr-over');
  S.shownRound = 0; S.flippedCount = 0; S.dealtRound = 0;
  const sw = $('sweep-slot');
  sw.innerHTML = '';
  if (st.settlement.sweep) {
    sw.innerHTML = `<div class="sweep-banner">
      <div class="x2">SWEEP ×2</div>
      <div>${esc(st.settlement.sweep.name)} לקח את כל 4 הסיבובים — הכפלה: ‎+${st.settlement.sweep.bonus}‎ נק' מהיריבים!</div>
    </div>`;
  }
  const table = $('settle');
  table.innerHTML = '';
  st.settlement.rows.forEach((row, i) => {
    const d = document.createElement('div');
    d.className = 'srow';
    const sign = row.delta > 0 ? 'plus' : row.delta < 0 ? 'minus' : '';
    d.innerHTML = `<span class="rank">${i + 1}</span>
      <span class="nm">${esc(row.name)}</span>
      <span style="color:var(--dim);font-size:13px">${row.wins} נצחונות</span>
      <span class="wl ${sign}">${row.delta > 0 ? '+' : ''}${row.delta}</span>
      <span class="bal">יתרה: ${row.balance}</span>`;
    table.appendChild(d);
  });
  const f = document.createElement('div');
  f.className = 'srow';
  f.style.cssText = 'justify-content:center;color:var(--dim);font-size:13px';
  f.textContent = st.practice
    ? '🎓 משחק אימון — הנקודות לא נספרו'
    : `עמלת בית: ${st.settlement.feeTotal} נק' (${st.fee} לשחקן)`;
  table.appendChild(f);
  const oa = $('over-actions');
  oa.innerHTML = '';
  if (amHost(st)) oa.appendChild(btn('משחק חדש 🔄', 'primary', () => action('rematch')));
  else {
    const w = document.createElement('div');
    w.className = 'waitmsg'; w.textContent = 'ממתינים למארח למשחק חדש…';
    oa.appendChild(w);
  }
  oa.appendChild(btn('🏠 דף הבית', 'ghost', leaveRoom));
}

async function action(type) {
  try { await api('/api/action', { code: S.code, pid: S.pid, type }); }
  catch (e) { toast(e.message, 1); }
}

/* ---------- דאשבורד ניהול ---------- */
$('admin-fab').onclick = () => { show('scr-dash'); renderDash(); };
$('dash-back').onclick = () => {
  if (S.code && S.state) render(S.state);
  else if (auth()) showLobby();
  else show('scr-auth');
};
function adminExpired() {
  S.adminToken = null;
  sessionStorage.removeItem('adminToken');
  renderDash();
}
function renderDash() {
  const body = $('dash-body');
  if (!S.adminToken) {
    body.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'glass lobby-box';
    const pin = document.createElement('input');
    pin.type = 'password'; pin.placeholder = 'קוד מנהל'; pin.className = 'code'; pin.maxLength = 12;
    const go = btn('כניסת מנהל', 'primary', async () => {
      try {
        const r = await api('/api/admin', { pin: pin.value });
        S.adminToken = r.token;
        sessionStorage.setItem('adminToken', r.token);
        renderDash();
      } catch (e) { toast(e.message, 1); }
    });
    pin.addEventListener('keydown', e => { if (e.key === 'Enter') go.click(); });
    const note = document.createElement('div');
    note.className = 'hint';
    note.textContent = 'רק בעל קוד המנהל יכול לנהל נקודות, חשבונות וקוד הזמנה.';
    box.append(pin, go, note);
    body.appendChild(box);
    return;
  }
  loadDash();
}
async function loadDash() {
  const body = $('dash-body');
  body.innerHTML = '<div class="waitmsg">טוען…</div>';
  let d;
  try { d = await api('/api/bank', { token: S.adminToken }); }
  catch (e) {
    if (e.status === 403) return adminExpired();
    body.innerHTML = '<div class="waitmsg">שגיאה בטעינה</div>';
    return toast(e.message, 1);
  }
  body.innerHTML = '';
  // כרטיסי מידע
  const chips = document.createElement('div');
  chips.className = 'dash-chips';
  chips.innerHTML = `
    <div class="glass chip"><div class="cv">${d.house}</div><div class="cl">💰 עמלות בית</div></div>
    <div class="glass chip click" id="chip-invite"><div class="cv" style="font-size:18px;direction:ltr">${esc(d.invite)}</div><div class="cl">🎟 קוד הזמנה (לחץ לשינוי)</div></div>
    <div class="glass chip"><div class="cv">${d.accounts.filter(a => !a.bot).length}</div><div class="cl">👤 חשבונות</div></div>`;
  body.appendChild(chips);
  chips.querySelector('#chip-invite').onclick = async () => {
    const code = prompt('קוד הזמנה חדש (4-20 תווים):', d.invite);
    if (!code) return;
    try { await api('/api/invite', { token: S.adminToken, code }); toast('✓ קוד ההזמנה עודכן'); loadDash(); }
    catch (e) { if (e.status === 403) adminExpired(); else toast(e.message, 1); }
  };
  // רשימת חשבונות
  const list = document.createElement('div');
  list.className = 'glass settle';
  if (!d.accounts.length) list.innerHTML = '<div class="waitmsg" style="padding:20px">אין עדיין חשבונות</div>';
  for (const a of d.accounts) {
    const row = document.createElement('div');
    row.className = 'drow';
    const info = document.createElement('div');
    info.className = 'dinfo';
    info.innerHTML = `<div class="dname">${a.bot ? '🤖 ' : ''}${esc(a.name)}</div>` +
      (a.email ? `<div class="demail">${esc(a.email)}</div>` : '');
    const pts = document.createElement('div');
    pts.className = 'dpts' + (a.points < 0 ? ' neg' : '');
    pts.textContent = a.points;
    row.append(info, pts);
    const grant = async amount => {
      try {
        const r = await api('/api/grant', { token: S.adminToken, key: a.key, amount });
        toast(`✓ ${r.name}: יתרה ${r.balance}`);
        loadDash();
      } catch (e) { if (e.status === 403) adminExpired(); else toast(e.message, 1); }
    };
    const deposit = async () => {
      const v = Number(prompt(`הפקדה ל"${a.name}" — כמה שילם? (5% עמלה יורדת אוטומטית):`));
      if (!v || v <= 0) return;
      try {
        const r = await api('/api/grant', { token: S.adminToken, key: a.key, amount: v, fee5: true });
        toast(`✓ ${r.name} קיבל ${r.credited} נק' · עמלה לבית: ${r.fee} · יתרה: ${r.balance}`);
        loadDash();
      } catch (e) { if (e.status === 403) adminExpired(); else toast(e.message, 1); }
    };
    row.append(
      btn('💰 הפקדה 5%', 'small gold', deposit),
      btn('+50', 'small', () => grant(50)),
      btn('‎-50', 'small', () => grant(-50)),
      btn('סכום…', 'small', () => {
        const v = Number(prompt(`סכום ל"${a.name}" בלי עמלה (שלילי להורדה):`));
        if (v) grant(v);
      }),
    );
    if (!a.bot) row.append(btn('🔑 סיסמה', 'small ghost', async () => {
      const pw = prompt(`סיסמה חדשה ל"${a.name}" (6+ תווים):`);
      if (!pw) return;
      try { await api('/api/resetpass', { token: S.adminToken, key: a.key, password: pw }); toast('✓ הסיסמה אופסה'); }
      catch (e) { if (e.status === 403) adminExpired(); else toast(e.message, 1); }
    }));
    list.appendChild(row);
  }
  body.appendChild(list);
  // פעולות
  const actions = document.createElement('div');
  actions.className = 'dash-actions';
  actions.append(
    btn('🔄 רענן', '', () => loadDash()),
    btn('⬇ גיבוי', 'ghost', async () => {
      try {
        const r = await api('/api/export', { token: S.adminToken });
        const blob = new Blob([JSON.stringify(r.data, null, 2)], { type: 'application/json' });
        const aEl = document.createElement('a');
        aEl.href = URL.createObjectURL(blob);
        aEl.download = 'omaha-backup.json';
        aEl.click();
        URL.revokeObjectURL(aEl.href);
      } catch (e) { if (e.status === 403) adminExpired(); else toast(e.message, 1); }
    }),
    btn('⬆ שחזור מגיבוי', 'ghost', () => $('import-file').click()),
  );
  body.appendChild(actions);
  const note = document.createElement('div');
  note.className = 'hint';
  note.style.textAlign = 'center';
  note.textContent = 'טיפ: הורד גיבוי אחרי כל ערב משחקים — כך היתרות שמורות אצלך גם אם השרת מתאפס.';
  body.appendChild(note);
}
$('import-file').onchange = async function () {
  const file = this.files[0];
  this.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const r = await api('/api/import', { token: S.adminToken, data });
    toast(`✓ שוחזרו ${r.count} חשבונות`);
    loadDash();
  } catch (e) { if (e.status === 403) adminExpired(); else toast(e.message || 'קובץ לא תקין', 1); }
};

/* ---------- אתחול ---------- */
(function init() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  const qs = new URLSearchParams(location.search);
  if (qs.get('join')) {
    // הזמנה מפורשת גוברת על סשן חדר שמור
    $('inp-code').value = qs.get('join').toUpperCase().slice(0, 4);
    if (auth()) showLobby(); else show('scr-auth');
    return;
  }
  const saved = localStorage.getItem('omaha');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      if (s.code && s.pid) { S.code = s.code; S.pid = s.pid; S.name = s.name; poll(); return; }
    } catch (e) {}
  }
  if (auth()) showLobby(); else show('scr-auth');
})();
</script>
</body>
</html>
